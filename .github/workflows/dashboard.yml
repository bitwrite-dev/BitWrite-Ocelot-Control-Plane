# CI for the dashboard (BitWrite.OcelotControl.Api has none yet — see #338).
#
# Runs the same three gates locally in one command: `npm run check`.

name: Dashboard CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

# Cancel superseded runs for the same ref.
concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: dashboard

jobs:
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the
      # committed lockfile pins and fails if package.json and the lockfile
      # disagree, which keeps the two from drifting.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
